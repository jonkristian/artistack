<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Italiana&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Before the first paint, or the admin flashes dark on every load for
         anyone who chose light. Only on /admin: the public site paints from
         its own palette and must not inherit a preference set in the tool. -->
    <script>
      if (location.pathname.startsWith('/admin')) {
        try {
          const saved = localStorage.getItem('artistack:admin-theme');
          if (saved === 'light') document.documentElement.dataset.theme = 'light';
        } catch {}
      }
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
