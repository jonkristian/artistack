# Coolify builds this repo with Nixpacks, whose default Node image has neither
# ffmpeg nor fontconfig. Without them the clip studio fails quietly rather than
# loudly: resolveFont() falls back to "sans-serif" when fc-match is missing,
# libass has nothing to resolve that to, and clips render successfully with no
# captions on them at all.
#
# Debian packages rather than Nix ones, because Debian's ffmpeg is built with
# libass — which the ASS caption filter needs.

# How the app works out who is calling. Set here rather than left to whoever
# deploys it, because anything built this way is behind Coolify's proxy by
# definition — and forgetting them is not an error anyone would notice: the
# sign-up rate limit quietly becomes ten an hour for the whole site instead of
# per visitor, and every page view logs no country at all.
#
# The address is read one entry from the *right* of the forwarded chain, which
# is the part the proxy wrote. The left of it is whatever the caller sent.
#
# Put another proxy in front — Cloudflare, say — and this wants XFF_DEPTH=2.
# Set it in Coolify's environment; a value passed at run time beats this one.
[variables]
ADDRESS_HEADER = "x-forwarded-for"
XFF_DEPTH = "1"

[phases.setup]
aptPkgs = [
  # The renderer. ffprobe ships in the same package.
  "ffmpeg",
  # fc-match, which resolveFont() shells out to.
  "fontconfig",
  # Fonts for FONT_PREFERENCES to resolve against. Captions want a condensed
  # face — narrow text fits more words per line on a 1080-wide vertical frame —
  # so Roboto Condensed leads the preference list. The others are fallbacks.
  "fonts-roboto-unhinted",
  "fonts-liberation",
  "fonts-dejavu-core",
]

# Deliberately no CLIP_FONT_FAMILY here. Pinning a font is supported (see
# resolveFont) and makes rendering deterministic, but only once you have
# confirmed the family actually exists in the built image — "Liberation Sans
# Narrow" looks like a safe pin and is not: Liberation 2.x dropped the Narrow
# faces, so it silently resolves to Nimbus Sans Narrow instead.
#
# Verify inside the running container, then pin whichever prints EXACT:
#
#   ffmpeg -version | grep enable-libass
#   for f in "Roboto Condensed" "Liberation Sans" "DejaVu Sans"; do
#     printf '%-22s -> %s\n' "$f" "$(fc-match -f '%{family}' "$f")"
#   done
#
# A render whose font did not resolve now logs
# "WARNING: no configured font resolved — captions may not render"
# into the job log, so this fails visibly rather than shipping blank clips.
